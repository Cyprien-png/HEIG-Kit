# HEIG-Kit RAG services. Every port is bound to 127.0.0.1: nothing is reachable from the network.
# Kept out of the repository root on purpose: Compose would otherwise read the root `.env` and interpolate
# the `$` that edu-ID passwords may contain.
#   npm run rag:start     database, embedding model and MCP server
#   npm run rag:stop      stops every service (data is kept in Docker volumes)
# `npm run ingest` also starts the document extraction service (profile "ingest") while it runs; the remote server
# (profile "server") keeps it running, since it indexes the courses itself.

name: heig-kit

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: heigkit
      # Local-only database (bound to 127.0.0.1), hence a fixed password.
      POSTGRES_PASSWORD: heigkit
      POSTGRES_DB: heigkit
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heigkit -d heigkit"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Embedding model (bge-m3, multilingual), pulled automatically on first use.
  embedder:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - models:/root/.ollama
    restart: unless-stopped

  # PDF/DOCX/PPTX to markdown. Heavy (~3 GB RAM): only started for ingestion on a personal installation, kept running
  # beside the remote server, which indexes from its status page and on its own when Cyberlearn changes.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    profiles: ["ingest", "server"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"

  # MCP server for AI assistants (Claude Code, Claude Desktop, n8n…), protected by the token in data/mcp-token.
  mcp:
    build:
      context: ..
      dockerfile: rag/mcp.Dockerfile
    environment:
      RAG_DATABASE_URL: postgres://heigkit:heigkit@db:5432/heigkit
      RAG_OLLAMA_URL: http://embedder:11434
    volumes:
      - ../data:/app/data:ro
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Remote server (npm run server:start, docs/server.md): the only service holding the secrets. Published on 127.0.0.1 only,
  # for a reverse proxy doing HTTPS on the same machine; HEIG_BIND=0.0.0.0 in rag/.env publishes it on the network, for a
  # reverse proxy elsewhere on the LAN.
  server:
    profiles: ["server"]
    # Published by .github/workflows/server-images.yml (npm run server:update); `npm run server:build` builds it here.
    image: ${HEIG_IMAGE_REGISTRY:-ghcr.io/cyprien-png}/heig-kit-server:${HEIG_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: rag/server.Dockerfile
    environment:
      HEIG_HTTP_HOST: 0.0.0.0
      HEIG_HTTP_PORT: "8766"
      # The library (generated documents and videos): the `outputs` volume, or a folder of this machine named by
      # HEIG_LIBRARY_DIR in rag/.env (absolute path, writable by uid 1000), mounted at the same path in the container so
      # that HEIG_DOCUMENTS_DIR / HEIG_VIDEOS_DIR of .env may point inside it.
      HEIG_OUTPUT_DIR: ${HEIG_LIBRARY_DIR:-/outputs}
      HEIG_JOBS_DIR: /jobs
      RAG_DATABASE_URL: postgres://heigkit:heigkit@db:5432/heigkit
      RAG_OLLAMA_URL: http://embedder:11434
      # The extraction service: without it the server indexes text and code only, PDFs and DOCX wait for its return.
      RAG_DOCLING_URL: http://docling:5001
    volumes:
      - ../.env:/app/.env:ro
      - ../data:/app/data
      - ../.cache:/app/.cache
      - ${HEIG_LIBRARY_DIR:-outputs}:${HEIG_LIBRARY_DIR:-/outputs}
      - jobs:/jobs
    ports:
      - "${HEIG_BIND:-127.0.0.1}:8766:8766"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8766/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Runs the code written by the AI (manim scenes, HTML and video scenes in a browser): no network, no .env, no data,
  # read-only system.
  # Handles one job and exits: `restart: always` gives a fresh container for the next one.
  render:
    profiles: ["server"]
    image: ${HEIG_IMAGE_REGISTRY:-ghcr.io/cyprien-png}/heig-kit-render:${HEIG_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: rag/render.Dockerfile
    network_mode: none
    environment:
      HEIG_JOBS_DIR: /jobs
      HEIG_CACHE_DIR: /voice-cache
    volumes:
      - jobs:/jobs
      - voice-cache:/voice-cache
    read_only: true
    tmpfs:
      # exec: the voice loads a library it copies there.
      - /tmp:size=4g,exec
    shm_size: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    # The voice of the high quality videos holds its model in memory (about 4 GB), then the browser draws the frames.
    mem_limit: 8g
    restart: always

volumes:
  db:
  models:
  outputs:
  jobs:
  voice-cache:
